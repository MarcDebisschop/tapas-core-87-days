services:
  - type: web
    name: tapas-87-days
    runtime: static
    staticPublishPath: .
    buildCommand: ''
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
